<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2471A3;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0D3559;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="heartGrad" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#D5E8F0;stop-opacity:1" />
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="15" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1024" height="1024" fill="url(#bg)"/>

  <!-- Subtle radial glow behind heart -->
  <circle cx="512" cy="420" r="280" fill="white" opacity="0.06"/>
  <circle cx="512" cy="420" r="220" fill="white" opacity="0.05"/>

  <!-- Outer ring -->
  <circle cx="512" cy="430" r="260" fill="none" stroke="white" stroke-width="3" opacity="0.15"/>

  <!-- Progress arc 3/4 -->
  <circle cx="512" cy="430" r="260" fill="none" stroke="white" stroke-width="4.5" opacity="0.5"
    stroke-dasharray="1225 408"
    stroke-linecap="round"
    transform="rotate(-90 512 430)"/>

  <!-- Heart (proper SVG heart path) -->
  <g filter="url(#glow)">
    <path d="M512 600
      C512 600, 340 480, 340 370
      C340 310, 380 260, 430 260
      C465 260, 495 285, 512 310
      C529 285, 559 260, 594 260
      C644 260, 684 310, 684 370
      C684 480, 512 600, 512 600Z"
      fill="url(#heartGrad)" opacity="0.95"/>
  </g>

  <!-- ECG waveform across the heart area -->
  <polyline
    points="260,680 360,680 400,680 430,680 455,640 475,720 500,610 525,700 545,660 565,680 610,680 740,680"
    fill="none"
    stroke="white"
    stroke-width="7"
    stroke-linecap="round"
    stroke-linejoin="round"
    opacity="0.75"/>

  <!-- Second subtle waveform behind (depth effect) -->
  <polyline
    points="300,695 380,695 410,695 435,695 455,670 475,730 498,645 520,715 540,680 558,695 600,695 710,695"
    fill="none"
    stroke="white"
    stroke-width="3"
    stroke-linecap="round"
    stroke-linejoin="round"
    opacity="0.2"/>

  <!-- Small measurement indicators -->
  <rect x="340" y="780" width="100" height="36" rx="8" fill="white" opacity="0.15"/>
  <text x="390" y="804" text-anchor="middle" font-family="Helvetica Neue, sans-serif" font-size="20" font-weight="700" fill="white" opacity="0.8">SYS</text>

  <rect x="462" y="780" width="100" height="36" rx="8" fill="white" opacity="0.15"/>
  <text x="512" y="804" text-anchor="middle" font-family="Helvetica Neue, sans-serif" font-size="20" font-weight="700" fill="white" opacity="0.8">DIA</text>

  <rect x="584" y="780" width="100" height="36" rx="8" fill="white" opacity="0.15"/>
  <text x="634" y="804" text-anchor="middle" font-family="Helvetica Neue, sans-serif" font-size="20" font-weight="700" fill="white" opacity="0.6">BPM</text>
</svg>
